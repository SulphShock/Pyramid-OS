# Pyramid OS hypridle - 5 MIN with Omarchy animation screensaver
# Omarchy: 150s -> omarchy-launch-screensaver (tte animation), 152s -> lock
# Pyramid: 295s -> pyramid-launch-screensaver (PYRAMID OS ascii + tte), 300s -> lock

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# dim after 2.5 min (keep)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 150
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume = brightnessctl -rd rgb:kbd_backlight
}

# Omarchy animation screensaver - 5 sec before lock (295s -> 300s)
listener {
    timeout = 295
    on-timeout = pidof hyprlock || ~/.local/bin/pyramid-launch-screensaver
}

# 5 MIN -> lock with PYRAMID OS hyprlock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
