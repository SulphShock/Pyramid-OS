# Pyramid OS hyprlock - with PYRAMID OS ASCII art
# Omarchy's idle tool is hypridle -> hyprlock, same here
# Pyramid Gold #C9A84C + Dark #1A1A1A + Accent #D4AF37
# Font: JetBrainsMono Nerd Font

$font = JetBrainsMono Nerd Font
$gold = rgba(C9A84Cff)
$accent = rgba(D4AF37ff)
$dark = rgba(1A1A1Aff)

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgba(C9A84Cff) rgba(D4AF37ff) 45deg
    check_color = rgba(D4AF37ff) rgba(00ff99ff) 120deg
    fail_color = rgba(ff6633ff) rgba(ff0066ff) 40deg
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL
    position = 0, -20
    halign = center
    valign = center
    dots_spacing = 0.3
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgba(eeeeeeff)
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(eeeeeeff)
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

