Pyramid OS pacman.conf
# Based on Arch default + Pyramid customization
# Law 1: No forced multilib | Law 4: Reproducible but not pinning repo infra here
#
# See pacman.conf(5) for details

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Law 1: multilib disabled by default (no 32-bit need). User can uncomment:
# [multilib]
# Include = /etc/pacman.d/mirrorlist

# Law 1: chaotic-aur optional - user must opt-in. Uncomment to enable:
# [chaotic-aur]
# Include = /etc/pacman.d/chaotic-mirrorlist
